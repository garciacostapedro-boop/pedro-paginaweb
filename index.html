<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu blog tech</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
    main { max-width: 600px; margin: 0 auto; }
    article { display: flex; gap: 15px; background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; }
    button { cursor: pointer; border: 1px solid #ccc; background: #eee; padding: 5px 10px; border-radius: 15px; }
    button.curtido { background: #e0f2fe; border-color: #0284c7; }
  </style>
</head>
<body>
  <main>
    <article>
      <img src="https://picsum.photos/120" alt="Tecnologia">
      <div>
        <h2>Meu primeiro post</h2>
        <p><b>Por: Marcelo Paludetto</b></p>
        <p>Boas-vindas ao meu novo blog! Dicas de programação e tecnologia.</p>
        <button>❤️ <span>0</span></button>
        <button>👍 <span>0</span></button>
      </div>
    </article>

    <article>
      <img src="https://picsum.photos/120?random=1" alt="Tecnologia">
      <div>
        <h2>Meu segundo post</h2>
        <p><b>Por: Marcelo Paludetto</b></p>
        <p>Boas-vindas ao meu novo blog! Dicas de programação e tecnologia.</p>
        <button>❤️ <span>0</span></button>
        <button>👍 <span>0</span></button>
      </div>
    </article>
  </main>

  <script>
    document.querySelectorAll("button").forEach(btn => {
      let curtiu = false;
      btn.onclick = () => {
        let span = btn.querySelector("span");
        span.textContent = Number(span.textContent) + (curtiu ? -1 : 1);
        curtiu = !curtiu;
        btn.classList.toggle("curtido", curtiu);
      };
    });
  </script>
</body>
</html>
